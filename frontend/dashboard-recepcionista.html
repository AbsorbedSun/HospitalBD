<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Recepcionista | MediConnect</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grain-overlay"></div>

    <div class="dashboard-container">
        <!-- ── SIDEBAR ── -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-mark"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 3V17M3 10H17" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg></div>
                    <span class="logo-text">MediConnect</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <!-- Panel Principal (Home) -->
                <button class="nav-item active" data-view="dashboard">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M3 9.5L10 3L17 9.5V17H13V13H7V17H3V9.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                    </svg>
                    <span>Panel Principal</span>
                </button>

                <!-- Gestión de Citas -->
                <button class="nav-item" data-view="citas">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <rect x="3" y="4" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M3 8H17M7 3V5M13 3V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>Gestión de Citas</span>
                </button>

                <!-- Pacientes -->
                <button class="nav-item" data-view="pacientes">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="8" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M2 16C2 13 4.68629 11 8 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <circle cx="14" cy="13" r="4" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M14 11V13H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>Pacientes</span>
                </button>

                <!-- Doctores -->
                <button class="nav-item" data-view="doctores">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M4 17C4 13.6863 6.68629 11 10 11C13.3137 11 16 13.6863 16 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M13 5H17M15 3V7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>Doctores</span>
                </button>

                <!-- Farmacia -->
                <button class="nav-item" data-view="farmacia">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M8 3H12L13 7H7L8 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                        <rect x="4" y="7" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M10 10V14M8 12H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>Farmacia</span>
                </button>

                <!-- Bitácoras -->
                <button class="nav-item" data-view="bitacoras">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M7 10H13M7 13H11M7 7H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M5 3H15C15.5523 3 16 3.44772 16 4V16C16 16.5523 15.5523 17 15 17H5C4.44772 17 4 16.5523 4 16V4C4 3.44772 4.44772 3 5 3Z" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    <span>Bitácoras</span>
                </button>

                <!-- Solicitudes de Cancelación -->
                <button class="nav-item" data-view="solicitudes">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M10 6V10L13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    <span>Solicitudes</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <button class="nav-item logout-btn" id="logoutBtn">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M13 3H16C16.5523 3 17 3.44772 17 4V16C17 16.5523 16.5523 17 16 17H13M8 14L12 10L8 6M12 10H3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>Cerrar Sesión</span>
                </button>
            </div>
        </aside>

        <!-- ── MAIN CONTENT ── -->
        <main class="main-content">
            <header class="content-header">
                <div>
                    <h1 id="pageTitle">Panel Principal</h1>
                    <p id="pageSubtitle">Resumen del hospital</p>
                </div>
                <div class="user-menu">
                    <div class="user-avatar">
                        <span id="userInitials">--</span>
                    </div>
                    <div class="user-info">
                        <strong id="userName">Cargando...</strong>
                        <span>Recepcionista</span>
                    </div>
                </div>
            </header>

            <div id="contentContainer" class="content-body">
                <!-- El JS renderiza el contenido aquí -->
            </div>
        </main>
    </div>

    <!-- ── SCRIPTS (api.js primero, luego el dashboard) ── -->
    <script src="js/api.js"></script>
    <script src="js/dashboard-recepcionista.js"></script>
</body>
</html>
