<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Paciente | MediConnect</title>
    <link rel="stylesheet" href="css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grain-overlay"></div>

    <div class="dashboard-container">
        <!-- ── SIDEBAR ── -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <svg width="40" height="40" viewBox="0 0 40 40" fill="none">
                        <rect width="40" height="40" rx="8" fill="#2D5F5D"/>
                        <path d="M20 10V30M10 20H30" stroke="white" stroke-width="3" stroke-linecap="round"/>
                    </svg>
                    <span class="logo-text">MediConnect</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <!-- Inicio / Bienvenida -->
                <button class="nav-item active" data-view="inicio">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M3 9.5L10 3L17 9.5V17H13V13H7V17H3V9.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                    </svg>
                    <span>Inicio</span>
                </button>

                <!-- Datos Personales -->
                <button class="nav-item" data-view="datos-personales">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M4 16C4 12.6863 6.68629 10 10 10C13.3137 10 16 12.6863 16 16" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    <span>Datos Personales</span>
                </button>

                <!-- Citas Agendadas -->
                <button class="nav-item" data-view="citas-agendadas">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <rect x="3" y="4" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M3 8H17M7 3V5M13 3V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>Citas Agendadas</span>
                </button>

                <!-- Agendar Nueva Cita -->
                <button class="nav-item" data-view="agendar-cita">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M10 6V14M6 10H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    <span>Agendar Nueva Cita</span>
                </button>

                <!-- Historial Médico -->
                <button class="nav-item" data-view="historial-medico">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M7 10H13M7 13H11M7 7H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M5 3H15C15.5523 3 16 3.44772 16 4V16C16 16.5523 15.5523 17 15 17H5C4.44772 17 4 16.5523 4 16V4C4 3.44772 4.44772 3 5 3Z" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    <span>Historial Médico</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <button class="nav-item logout-btn" id="logoutBtn">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M13 3H16C16.5523 3 17 3.44772 17 4V16C17 16.5523 16.5523 17 16 17H13M8 14L12 10L8 6M12 10H3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>Cerrar Sesión</span>
                </button>
            </div>
        </aside>

        <!-- ── MAIN CONTENT ── -->
        <main class="main-content">
            <header class="content-header">
                <div>
                    <h1 id="pageTitle">Inicio</h1>
                    <p id="pageSubtitle">Bienvenido a tu panel de paciente</p>
                </div>
                <div class="user-menu">
                    <div class="user-avatar">
                        <span id="userInitials">--</span>
                    </div>
                    <div class="user-info">
                        <strong id="userName">Cargando...</strong>
                        <span>Paciente</span>
                    </div>
                </div>
            </header>

            <div id="contentContainer" class="content-body">
                <!-- El JS renderiza el contenido aquí -->
            </div>
        </main>
    </div>

    <!-- ── SCRIPTS (api.js primero, luego el dashboard) ── -->
    <script src="js/api.js"></script>
    <script src="js/dashboard-paciente.js"></script>
</body>
</html>
