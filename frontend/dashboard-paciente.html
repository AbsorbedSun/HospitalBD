    <template id="agendar-cita-template">
        <div class="view-content">
            <div class="form-container">
                <h3 class="mb-2">Agendar Nueva Cita</h3>
                <p class="text-secondary mb-3">Selecciona la especialidad, doctor, fecha y horario de tu preferencia</p>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Especialidad</label>
                        <select>
                            <option>Seleccionar especialidad...</option>
                            <option>Cardiología</option>
                            <option>Dermatología</option>
                            <option>Ginecología</option>
                            <option>Medicina General</option>
                            <option>Nefrología</option>
                            <option>Nutriología</option>
                            <option>Oftalmología</option>
                            <option>Oncología</option>
                            <option>Ortopedia</option>
                            <option>Pediatría</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Doctor</label>
                        <select>
                            <option>Seleccionar doctor...</option>
                            <option>Dr. García López - Cardiología</option>
                            <option>Dra. Martínez Cruz - Oftalmología</option>
                            <option>Dr. Rodríguez Pérez - Medicina General</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Fecha</label>
                        <input type="date">
                    </div>

                    <div class="form-group">
                        <label>Horario</label>
                        <select>
                            <option>Seleccionar horario...</option>
                            <option>09:00 AM</option>
                            <option>10:00 AM</option>
                            <option>11:00 AM</option>
                            <option>12:00 PM</option>
                            <option>03:00 PM</option>
                            <option>04:00 PM</option>
                        </select>
                    </div>

                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>Motivo de Consulta</label>
                        <textarea placeholder="Describe brevemente el motivo de tu consulta..."></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button class="btn btn-secondary">Cancelar</button>
                    <button class="btn btn-primary">Agendar Cita</button>
                </div>
            </div>
        </div>
