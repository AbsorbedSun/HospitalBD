<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Recepción — MediConnect</title>
  <link rel="stylesheet" href="/assets/css/dashboard.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="grain"></div>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <div class="dashboard-shell">

    <!-- ══ SIDEBAR ══ -->
    <aside class="sidebar" id="sidebar">
      <a href="/" class="sidebar-logo">
        <div class="sidebar-logo-mark">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M10 3V17M3 10H17" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
        </div>
        <span class="sidebar-logo-text">MediConnect</span>
      </a>

      <nav class="sidebar-nav">
        <div class="sidebar-label">Principal</div>
        <button class="nav-item active" data-view="dashboard">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M3 9.5L10 3L17 9.5V17H13V13H7V17H3V9.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span>Panel General</span>
        </button>

        <div class="sidebar-divider"></div>
        <div class="sidebar-label">Operación</div>

        <button class="nav-item" data-view="citas">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M3 8H17M7 3V5M13 3V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Citas</span>
        </button>
        <button class="nav-item" data-view="solicitudes">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/><path d="M10 6V10L13 13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Solicitudes</span>
        </button>
        <button class="nav-item" data-view="farmacia">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M8 3H12L13 7H7L8 3Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><rect x="4" y="7" width="12" height="10" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M10 10V14M8 12H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Farmacia y Ventas</span>
        </button>

        <div class="sidebar-divider"></div>
        <div class="sidebar-label">Directorio</div>

        <button class="nav-item" data-view="pacientes">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><circle cx="8" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M2 16C2 13 4.69 11 8 11" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><circle cx="14" cy="13" r="4" stroke="currentColor" stroke-width="1.5"/><path d="M14 11V13H16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Pacientes</span>
        </button>
        <button class="nav-item" data-view="doctores">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M4 17C4 13.69 6.69 11 10 11C13.31 11 16 13.69 16 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M13 5H17M15 3V7" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Doctores</span>
        </button>

        <div class="sidebar-divider"></div>
        <div class="sidebar-label">Sistema</div>

        <button class="nav-item" data-view="bitacoras">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M5 3H15C15.55 3 16 3.45 16 4V16C16 16.55 15.55 17 15 17H5C4.45 17 4 16.55 4 16V4C4 3.45 4.45 3 5 3Z" stroke="currentColor" stroke-width="1.5"/><path d="M7 10H13M7 13H11M7 7H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Bitácoras</span>
        </button>
        <button class="nav-item" data-view="mi-perfil">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M4 17C4 14.24 6.69 12 10 12C13.31 12 16 14.24 16 17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/><path d="M13 5L14.5 6.5L17 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Mi Perfil</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-avatar" style="background:#1e2d4a"><span id="userInitials">--</span></div>
          <div style="flex:1;min-width:0;">
            <div class="sidebar-username" id="userName">Cargando...</div>
            <div class="sidebar-role">Recepcionista</div>
          </div>
        </div>
        <button class="logout-btn" id="logoutBtn">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M13 3H16C16.55 3 17 3.45 17 4V16C17 16.55 16.55 17 16 17H13M8 14L12 10L8 6M12 10H3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Cerrar sesión
        </button>
      </div>
    </aside>

    <!-- ══ MAIN ══ -->
    <div class="main-content">
      <header class="topbar">
        <div class="flex items-center gap-3">
          <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Menú">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5H17M3 10H17M3 15H17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <div>
            <div class="topbar-title" id="pageTitle">Panel General</div>
            <div class="topbar-subtitle" id="pageSubtitle">Resumen del hospital</div>
          </div>
        </div>
        <div class="topbar-right">
          <span class="badge badge-brand text-xs hidden md:inline-flex">Recepción</span>
        </div>
      </header>

      <main class="page-content">
        <div id="contentContainer" class="view-content"></div>
      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('visible');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('visible');
    }
  </script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/dashboard-recepcionista.js"></script>
</body>
</html>
