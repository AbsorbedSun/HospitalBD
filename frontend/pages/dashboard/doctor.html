<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Doctor | MediConnect</title>
    <link rel="stylesheet" href="/assets/css/dashboard.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="grain-overlay"></div>
    
    <div class="dashboard-container">
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo">
                    <div class="logo-mark"><svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M10 3V17M3 10H17" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg></div>
                    <span class="logo-text">MediConnect</span>
                </div>
            </div>

            <nav class="sidebar-nav">
                <!-- Inicio / Bienvenida -->
                <button class="nav-item active" data-view="inicio">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M3 9.5L10 3L17 9.5V17H13V13H7V17H3V9.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
                    </svg>
                    <span>Inicio</span>
                </button>

                <button class="nav-item" data-view="datos-doctor">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M4 16C4 12.6863 6.68629 10 10 10C13.3137 10 16 12.6863 16 16" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    <span>Datos del Doctor</span>
                </button>

                <button class="nav-item" data-view="citas">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <rect x="3" y="4" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M3 8H17M7 3V5M13 3V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>Mis Citas</span>
                </button>

                <button class="nav-item" data-view="pacientes">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M6 9C7.10457 9 8 8.10457 8 7C8 5.89543 7.10457 5 6 5C4.89543 5 4 5.89543 4 7C4 8.10457 4.89543 9 6 9Z" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M14 9C15.1046 9 16 8.10457 16 7C16 5.89543 15.1046 5 14 5C12.8954 5 12 5.89543 12 7C12 8.10457 12.8954 9 14 9Z" stroke="currentColor" stroke-width="1.5"/>
                        <path d="M2 14C2 11.7909 3.79086 10 6 10C8.20914 10 10 11.7909 10 14M12 14C12 11.7909 13.7909 10 16 10C18.2091 10 20 11.7909 20 14" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    <span>Mis Pacientes</span>
                </button>

                <button class="nav-item" data-view="recetas">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M7 10H13M7 13H11M7 7H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M5 3H15C15.5523 3 16 3.44772 16 4V16C16 16.5523 15.5523 17 15 17H5C4.44772 17 4 16.5523 4 16V4C4 3.44772 4.44772 3 5 3Z" stroke="currentColor" stroke-width="1.5"/>
                    </svg>
                    <span>Recetas Médicas</span>
                </button>
            </nav>

            <div class="sidebar-footer">
                <button class="nav-item logout-btn" id="logoutBtn">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none">
                        <path d="M13 3H16C16.5523 3 17 3.44772 17 4V16C17 16.5523 16.5523 17 16 17H13M8 14L12 10L8 6M12 10H3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                    <span>Cerrar Sesión</span>
                </button>
            </div>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <div>
                    <h1 id="pageTitle">Inicio</h1>
                    <p id="pageSubtitle">Bienvenido a tu panel médico</p>
                </div>
                <div class="user-menu">
                    <div class="user-avatar">
                        <span id="userInitials">CM</span>
                    </div>
                    <div class="user-info">
                        <strong id="userName">Dr. Carlos Méndez</strong>
                        <span>Doctor</span>
                    </div>
                </div>
            </header>

            <div id="contentContainer" class="content-body">
                </div>
        </main>
    </div>

    <template id="datos-doctor-template">
        <div class="view-content">
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon">📅</div>
                    <div class="stat-value">12</div>
                    <div class="stat-label">Citas de Hoy</div>
                    <div class="stat-change positive">↑ 3 vs ayer</div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">👥</div>
                    <div class="stat-value">156</div>
                    <div class="stat-label">Pacientes Activos</div>
                    <div class="stat-change positive">↑ 8 este mes</div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">💊</div>
                    <div class="stat-value">28</div>
                    <div class="stat-label">Recetas Emitidas</div>
                    <div class="stat-change">Esta semana</div>
                </div>

                <div class="stat-card">
                    <div class="stat-icon">⏰</div>
                    <div class="stat-value">85%</div>
                    <div class="stat-label">Tasa de Ocupación</div>
                    <div class="stat-change positive">↑ 5% este mes</div>
                </div>
            </div>

            <div class="info-grid">
                <div class="info-card">
                    <div class="info-header">
                        <h3>Información Profesional</h3>
                        <span class="badge-solo-lectura" style="font-size: 0.85rem; color: var(--text-secondary);">Solo Lectura</span>
                    </div>
                    <div class="info-body">
                        <div class="info-row">
                            <span class="label">Nombre Completo</span>
                            <span class="value">Dr. Carlos Méndez Rivera</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Número de Empleado</span>
                            <span class="value">EMP-001234</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Cédula Profesional</span>
                            <span class="value">CED-123456</span>
                        </div>
                        <div class="info-row">
                            <span class="label">CURP</span>
                            <span class="value">MERC850315HDFRJR09</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Especialidad</span>
                            <span class="value">Cardiología</span>
                        </div>
                    </div>
                </div>

                <div class="info-card">
                    <div class="info-header">
                        <h3>Horario Laboral</h3>
                    </div>
                    <div class="info-body">
                        <div class="info-row">
                            <span class="label">Lunes - Viernes</span>
                            <span class="value">9:00 AM - 6:00 PM</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Consultorio Asignado</span>
                            <span class="value">Consultorio 3</span>
                        </div>
                        <div class="info-row">
                            <span class="label">Citas Máximas por Día</span>
                            <span class="value">8 pacientes</span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </template>

    <template id="citas-template">
        <div class="view-content">
            <div class="table-container">
                <div class="table-header">
                    <h3>Mis Citas del Día</h3>
                    <div class="table-filters">
                        <input type="text" class="filter-input" placeholder="Buscar paciente...">
                        <select class="filter-select">
                            <option>Todas</option>
                            <option>Pendientes</option>
                            <option>Atendidas</option>
                            <option>No Asistió</option>
                        </select>
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Hora</th>
                            <th>Paciente</th>
                            <th>Motivo</th>
                            <th>Estatus</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>09:00 AM</td>
                            <td>Juan Pérez García</td>
                            <td>Control de presión arterial</td>
                            <td><span class="status-badge success">Atendida</span></td>
                            <td>
                                <button class="btn-icon">Ver Historial</button>
                            </td>
                        </tr>
                        <tr>
                            <td>10:00 AM</td>
                            <td>María González López</td>
                            <td>Chequeo general</td>
                            <td><span class="status-badge warning">Pendiente</span></td>
                            <td>
                                <button class="btn-icon">Ver Historial</button>
                            </td>
                        </tr>
                        <tr>
                            <td>11:00 AM</td>
                            <td>Pedro Sánchez Ruiz</td>
                            <td>Seguimiento post-operatorio</td>
                            <td><span class="status-badge warning">Pendiente</span></td>
                            <td>
                                <button class="btn-icon">Ver Historial</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </template>

    <template id="pacientes-template">
        <div class="view-content">
            <div class="table-container">
                <div class="table-header">
                    <h3>Mis Pacientes</h3>
                    <div class="table-filters">
                        <input type="text" class="filter-input" placeholder="Buscar paciente...">
                    </div>
                </div>
                <table>
                    <thead>
                        <tr>
                            <th>Nombre</th>
                            <th>Tipo de Sangre</th>
                            <th>Alergias</th>
                            <th>Última Consulta</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>Juan Pérez García</td>
                            <td>O+</td>
                            <td>Penicilina</td>
                            <td>07 Feb 2026</td>
                            <td>
                                <button class="btn-icon">Ver Historial</button>
                            </td>
                        </tr>
                        <tr>
                            <td>María González López</td>
                            <td>A+</td>
                            <td>Ninguna</td>
                            <td>05 Feb 2026</td>
                            <td>
                                <button class="btn-icon">Ver Historial</button>
                            </td>
                        </tr>
                        <tr>
                            <td>Pedro Sánchez Ruiz</td>
                            <td>B+</td>
                            <td>Polen, Ácaros</td>
                            <td>03 Feb 2026</td>
                            <td>
                                <button class="btn-icon">Ver Historial</button>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </template>

    <template id="recetas-template">
        <div class="view-content">
            <div class="form-container">
                <h3 class="mb-2">Nueva Receta Médica</h3>
                <p class="text-secondary mb-3">Completa la información para generar la receta</p>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>Paciente</label>
                        <select>
                            <option>Seleccionar paciente...</option>
                            <option>Juan Pérez García</option>
                            <option>María González López</option>
                            <option>Pedro Sánchez Ruiz</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Fecha</label>
                        <input type="date">
                    </div>

                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>Diagnóstico</label>
                        <textarea placeholder="Escribe el diagnóstico..."></textarea>
                    </div>

                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>Medicamento(s)</label>
                        <textarea placeholder="Lista de medicamentos prescritos..."></textarea>
                    </div>

                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>Tratamiento</label>
                        <textarea placeholder="Indicaciones del tratamiento..."></textarea>
                    </div>

                    <div class="form-group" style="grid-column: 1 / -1;">
                        <label>Observaciones</label>
                        <textarea placeholder="Observaciones adicionales..."></textarea>
                    </div>
                </div>

                <div class="form-actions">
                    <button class="btn btn-secondary">Cancelar</button>
                    <button class="btn btn-primary">Generar Receta</button>
                </div>
            </div>
        </div>
    </template>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/dashboard-doctor.js"></script>
</body>
</html>
