<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Médico — MediConnect</title>
  <link rel="stylesheet" href="/assets/css/dashboard.css">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
  <div class="grain"></div>
  <div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>

  <div class="dashboard-shell">

    <!-- ══ SIDEBAR ══ -->
    <aside class="sidebar" id="sidebar">
      <a href="/" class="sidebar-logo">
        <div class="sidebar-logo-mark">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M10 3V17M3 10H17" stroke="white" stroke-width="2.5" stroke-linecap="round"/></svg>
        </div>
        <span class="sidebar-logo-text">MediConnect</span>
      </a>

      <nav class="sidebar-nav">
        <div class="sidebar-label">Principal</div>
        <button class="nav-item active" data-view="inicio">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M3 9.5L10 3L17 9.5V17H13V13H7V17H3V9.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/></svg>
          <span>Inicio</span>
        </button>
        <button class="nav-item" data-view="datos-doctor">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/><path d="M4 16C4 12.69 6.69 10 10 10C13.31 10 16 12.69 16 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Mi Perfil</span>
        </button>

        <div class="sidebar-divider"></div>
        <div class="sidebar-label">Agenda</div>

        <button class="nav-item" data-view="citas">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><rect x="3" y="4" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/><path d="M3 8H17M7 3V5M13 3V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Mis Citas</span>
        </button>

        <div class="sidebar-divider"></div>
        <div class="sidebar-label">Pacientes</div>

        <button class="nav-item" data-view="pacientes">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M6 9C7.1 9 8 8.1 8 7C8 5.9 7.1 5 6 5C4.9 5 4 5.9 4 7C4 8.1 4.9 9 6 9Z" stroke="currentColor" stroke-width="1.5"/><path d="M14 9C15.1 9 16 8.1 16 7C16 5.9 15.1 5 14 5C12.9 5 12 5.9 12 7C12 8.1 12.9 9 14 9Z" stroke="currentColor" stroke-width="1.5"/><path d="M2 14C2 11.79 3.79 10 6 10C8.21 10 10 11.79 10 14M12 14C12 11.79 13.79 10 16 10C18.21 10 20 11.79 20 14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Mis Pacientes</span>
        </button>
        <button class="nav-item" data-view="recetas">
          <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><path d="M5 3H15C15.55 3 16 3.45 16 4V16C16 16.55 15.55 17 15 17H5C4.45 17 4 16.55 4 16V4C4 3.45 4.45 3 5 3Z" stroke="currentColor" stroke-width="1.5"/><path d="M7 10H13M7 13H11M7 7H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          <span>Emitir Receta</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="sidebar-avatar" style="background:#1e2d4a"><span id="userInitials">--</span></div>
          <div style="flex:1;min-width:0;">
            <div class="sidebar-username" id="userName">Cargando...</div>
            <div class="sidebar-role">Médico</div>
          </div>
        </div>
        <button class="logout-btn" id="logoutBtn">
          <svg width="14" height="14" viewBox="0 0 20 20" fill="none"><path d="M13 3H16C16.55 3 17 3.45 17 4V16C17 16.55 16.55 17 16 17H13M8 14L12 10L8 6M12 10H3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          Cerrar sesión
        </button>
      </div>
    </aside>

    <!-- ══ MAIN ══ -->
    <div class="main-content">
      <header class="topbar">
        <div class="flex items-center gap-3">
          <button class="sidebar-toggle" onclick="toggleSidebar()" aria-label="Menú">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 5H17M3 10H17M3 15H17" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
          </button>
          <div>
            <div class="topbar-title" id="pageTitle">Inicio</div>
            <div class="topbar-subtitle" id="pageSubtitle">Panel médico</div>
          </div>
        </div>
        <div class="topbar-right">
          <span class="badge badge-brand text-xs hidden md:inline-flex">Doctor</span>
        </div>
      </header>

      <main class="page-content">
        <div id="contentContainer" class="view-content"></div>
      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <!-- TEMPLATES -->
  <template id="datos-doctor-template">
    <div class="view-content">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-icon"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="3" y="4" width="14" height="13" rx="2"/><path d="M3 8H17M7 3V5M13 3V5"/></svg></div>
          <div class="stat-value">12</div>
          <div class="stat-label">Citas de Hoy</div>
          <div class="stat-change up">↑ 3 vs ayer</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 9C7.1 9 8 8.1 8 7C8 5.9 7.1 5 6 5C4.9 5 4 5.9 4 7C4 8.1 4.9 9 6 9Z"/><path d="M14 9C15.1 9 16 8.1 16 7C16 5.9 15.1 5 14 5C12.9 5 12 5.9 12 7C12 8.1 12.9 9 14 9Z"/><path d="M2 14C2 11.79 3.79 10 6 10C8.21 10 10 11.79 10 14M12 14C12 11.79 13.79 10 16 10C18.21 10 20 11.79 20 14"/></svg></div>
          <div class="stat-value">156</div>
          <div class="stat-label">Pacientes Activos</div>
          <div class="stat-change up">↑ 8 este mes</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 4H14C14.55 4 15 4.45 15 5V16C15 16.55 14.55 17 14 17H6C5.45 17 5 16.55 5 16V5C5 4.45 5.45 4 6 4Z"/><path d="M8 8H12M8 11H12M8 14H10"/><path d="M12 2V5M8 2V5"/></svg></div>
          <div class="stat-value">28</div>
          <div class="stat-label">Recetas Emitidas</div>
          <div class="stat-change neutral">Esta semana</div>
        </div>
        <div class="stat-card">
          <div class="stat-icon"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="10" cy="10" r="7"/><path d="M10 6V10L13 12"/></svg></div>
          <div class="stat-value">85%</div>
          <div class="stat-label">Ocupación</div>
          <div class="stat-change up">↑ 5% este mes</div>
        </div>
      </div>
      <div class="info-grid">
        <div class="card card-p">
          <div class="card-header">
            <div class="card-title">Información Profesional</div>
            <span class="badge badge-neutral" style="font-size:.68rem">Solo lectura</span>
          </div>
          <div class="info-row"><span class="info-label">Nombre Completo</span><span class="info-value">Dr. Carlos Méndez Rivera</span></div>
          <div class="info-row"><span class="info-label">Número de Empleado</span><span class="info-value">EMP-001234</span></div>
          <div class="info-row"><span class="info-label">Cédula Profesional</span><span class="info-value">CED-123456</span></div>
          <div class="info-row"><span class="info-label">CURP</span><span class="info-value" style="font-size:.78rem">MERC850315HDFRJR09</span></div>
          <div class="info-row"><span class="info-label">Especialidad</span><span class="info-value"><span class="badge badge-brand">Cardiología</span></span></div>
        </div>
        <div class="card card-p">
          <div class="card-header"><div class="card-title">Horario Laboral</div></div>
          <div class="info-row"><span class="info-label">Turno</span><span class="info-value">Lunes – Viernes</span></div>
          <div class="info-row"><span class="info-label">Horario</span><span class="info-value">9:00 AM – 6:00 PM</span></div>
          <div class="info-row"><span class="info-label">Consultorio</span><span class="info-value">Consultorio 3</span></div>
          <div class="info-row"><span class="info-label">Máx. citas/día</span><span class="info-value">8 pacientes</span></div>
        </div>
      </div>
    </div>
  </template>

  <template id="citas-template">
    <div class="view-content">
      <div class="card">
        <div class="table-toolbar">
          <div class="font-semibold text-sm" style="color:var(--text)">Citas del Día</div>
          <div style="display:flex;gap:.5rem;flex-wrap:wrap">
            <input type="text" class="filter-input" placeholder="Buscar paciente…">
            <select class="filter-select">
              <option>Todas</option><option>Pendientes</option><option>Atendidas</option><option>No Asistió</option>
            </select>
          </div>
        </div>
        <div class="table-wrap" style="border:none;border-radius:0">
          <table>
            <thead><tr><th>Hora</th><th>Paciente</th><th>Motivo</th><th>Estatus</th><th>Acciones</th></tr></thead>
            <tbody>
              <tr>
                <td style="font-weight:600">09:00 AM</td>
                <td>Juan Pérez García</td>
                <td style="color:var(--muted)">Control de presión arterial</td>
                <td><span class="badge badge-success">Atendida</span></td>
                <td><button class="btn btn-secondary btn-sm">Ver Historial</button></td>
              </tr>
              <tr>
                <td style="font-weight:600">10:00 AM</td>
                <td>María González López</td>
                <td style="color:var(--muted)">Chequeo general</td>
                <td><span class="badge badge-warning">Pendiente</span></td>
                <td><button class="btn btn-secondary btn-sm">Ver Historial</button></td>
              </tr>
              <tr>
                <td style="font-weight:600">11:00 AM</td>
                <td>Pedro Sánchez Ruiz</td>
                <td style="color:var(--muted)">Seguimiento post-operatorio</td>
                <td><span class="badge badge-warning">Pendiente</span></td>
                <td><button class="btn btn-secondary btn-sm">Ver Historial</button></td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </template>

  <template id="pacientes-template">
    <div class="view-content">
      <div class="card">
        <div class="table-toolbar">
          <div class="font-semibold text-sm" style="color:var(--text)">Mis Pacientes</div>
          <input type="text" class="filter-input" placeholder="Buscar paciente…">
        </div>
        <div class="table-wrap" style="border:none;border-radius:0">
          <table>
            <thead><tr><th>Nombre</th><th>Tipo Sangre</th><th>Alergias</th><th>Última Consulta</th><th>Acciones</th></tr></thead>
            <tbody>
              <tr><td>Juan Pérez García</td><td><span class="badge badge-error">O+</span></td><td>Penicilina</td><td style="color:var(--muted)">07 Feb 2026</td><td><button class="btn btn-secondary btn-sm">Ver Historial</button></td></tr>
              <tr><td>María González López</td><td><span class="badge badge-info">A+</span></td><td>Ninguna</td><td style="color:var(--muted)">05 Feb 2026</td><td><button class="btn btn-secondary btn-sm">Ver Historial</button></td></tr>
              <tr><td>Pedro Sánchez Ruiz</td><td><span class="badge badge-warning">B+</span></td><td>Polen, Ácaros</td><td style="color:var(--muted)">03 Feb 2026</td><td><button class="btn btn-secondary btn-sm">Ver Historial</button></td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </template>

  <template id="recetas-template">
    <div class="view-content">
      <div class="form-container">
        <div style="margin-bottom:1.25rem">
          <div class="font-semibold" style="font-size:1rem;color:var(--text)">Nueva Receta Médica</div>
          <div style="font-size:.83rem;color:var(--muted);margin-top:.2rem">Completa la información para generar la receta electrónica</div>
        </div>
        <div class="form-grid">
          <div class="form-group">
            <label>Paciente</label>
            <select><option>Seleccionar paciente…</option><option>Juan Pérez García</option><option>María González López</option></select>
          </div>
          <div class="form-group">
            <label>Fecha</label>
            <input type="date">
          </div>
          <div class="form-group" style="grid-column:1/-1">
            <label>Diagnóstico</label>
            <textarea placeholder="Describe el diagnóstico del paciente…"></textarea>
          </div>
          <div class="form-group" style="grid-column:1/-1">
            <label>Medicamento(s)</label>
            <textarea placeholder="Lista de medicamentos prescritos…"></textarea>
          </div>
          <div class="form-group" style="grid-column:1/-1">
            <label>Tratamiento</label>
            <textarea placeholder="Indicaciones del tratamiento…"></textarea>
          </div>
          <div class="form-group" style="grid-column:1/-1">
            <label>Observaciones</label>
            <textarea placeholder="Observaciones adicionales…"></textarea>
          </div>
        </div>
        <div class="form-actions">
          <button class="btn btn-secondary">Cancelar</button>
          <button class="btn btn-primary">Generar Receta</button>
        </div>
      </div>
    </div>
  </template>

  <script>
    function toggleSidebar() {
      document.getElementById('sidebar').classList.toggle('open');
      document.getElementById('sidebarOverlay').classList.toggle('visible');
    }
    function closeSidebar() {
      document.getElementById('sidebar').classList.remove('open');
      document.getElementById('sidebarOverlay').classList.remove('visible');
    }
  </script>
  <script src="/assets/js/api.js"></script>
  <script src="/assets/js/dashboard-doctor.js"></script>
</body>
</html>
