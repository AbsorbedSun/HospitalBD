<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard - Paciente | MediConnect</title>
    <link rel="stylesheet" href="/assets/css/dashboard.css" />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="grain-overlay"></div>

    <div class="dashboard-container">

      <!-- ══ TOP NAV ══ -->
      <header class="top-nav">

        <!-- Logo -->
        <a href="/index.html" class="logo">
          <div class="logo-mark">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
              <path d="M10 3V17M3 10H17" stroke="#121e31" stroke-width="2.5" stroke-linecap="round"/>
            </svg>
          </div>
          <span class="logo-text">MediConnect</span>
        </a>

        <!-- Nav items (centro) -->
        <nav class="sidebar-nav">
          <button class="nav-item active" data-view="inicio">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
              <path d="M3 9.5L10 3L17 9.5V17H13V13H7V17H3V9.5Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
            </svg>
            <span>Inicio</span>
          </button>

          <button class="nav-item" data-view="datos-personales">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
              <circle cx="10" cy="7" r="3" stroke="currentColor" stroke-width="1.5"/>
              <path d="M4 16C4 12.6863 6.68629 10 10 10C13.3137 10 16 12.6863 16 16" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>Datos Personales</span>
          </button>

          <button class="nav-item" data-view="citas-agendadas">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
              <rect x="3" y="4" width="14" height="13" rx="2" stroke="currentColor" stroke-width="1.5"/>
              <path d="M3 8H17M7 3V5M13 3V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>Mis Citas</span>
          </button>

          <button class="nav-item" data-view="agendar-cita">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
              <circle cx="10" cy="10" r="7" stroke="currentColor" stroke-width="1.5"/>
              <path d="M10 6V14M6 10H14" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>Nueva Cita</span>
          </button>

          <button class="nav-item" data-view="historial-medico">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
              <path d="M5 3H15C15.5523 3 16 3.44772 16 4V16C16 16.5523 15.5523 17 15 17H5C4.44772 17 4 16.5523 4 16V4C4 3.44772 4.44772 3 5 3Z" stroke="currentColor" stroke-width="1.5"/>
              <path d="M7 10H13M7 13H11M7 7H13" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>Historial</span>
          </button>

          <button class="nav-item" data-view="mis-recetas">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
              <path d="M6 4H14C14.5523 4 15 4.44772 15 5V16C15 16.5523 14.5523 17 14 17H6C5.44772 17 5 16.5523 5 16V5C5 4.44772 5.44772 4 6 4Z" stroke="currentColor" stroke-width="1.5"/>
              <path d="M8 8H12M8 11H12M8 14H10" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <path d="M12 2V5M8 2V5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>Recetas</span>
          </button>

          <button class="nav-item" data-view="farmacia-paciente">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none">
              <path d="M3 6H17L15.5 16H4.5L3 6Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
              <path d="M1 3H19" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="7.5" cy="18.5" r="1" stroke="currentColor" stroke-width="1"/>
              <circle cx="12.5" cy="18.5" r="1" stroke="currentColor" stroke-width="1"/>
            </svg>
            <span>Farmacia</span>
          </button>
        </nav>

        <!-- Derecha: usuario + logout -->
        <div class="nav-right">
          <div class="nav-user-pill">
            <div class="nav-avatar"><span id="userInitials">--</span></div>
            <span class="nav-username" id="userName">Cargando...</span>
          </div>
          <button class="logout-btn" id="logoutBtn" title="Cerrar sesión">
            <svg width="15" height="15" viewBox="0 0 20 20" fill="none">
              <path d="M13 3H16C16.5523 3 17 3.44772 17 4V16C17 16.5523 16.5523 17 16 17H13M8 14L12 10L8 6M12 10H3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
            <span>Salir</span>
          </button>
        </div>

      </header>

      <!-- ══ MAIN CONTENT ══ -->
      <main class="main-content">
        <header class="content-header">
          <div>
            <h1 id="pageTitle">Inicio</h1>
            <p id="pageSubtitle">Bienvenido a tu panel de paciente</p>
          </div>
        </header>
        <div id="contentContainer" class="content-body"></div>
      </main>

    </div>

    <script src="/assets/js/api.js"></script>
    <script src="/assets/js/dashboard-paciente.js"></script>
  </body>
</html>
